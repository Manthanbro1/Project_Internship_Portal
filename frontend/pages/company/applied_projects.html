<h3>Recommended Projects</h3>
<div id="projects"></div>

<script>
async function loadRecommendedProjects(internshipId) {
  const res = await fetch(
    `${API}/projects/recommended/${internshipId}`,
    { headers: getAuthHeaders() }
  );

  const data = await res.json();
  const div = document.getElementById("projects");

  data.forEach(p => {
    div.innerHTML += `
      <p>${p.title} – Match: ${p.similarity_score}%</p>
    `;
  });
}
</script>
