<!DOCTYPE html>
<html>
<head>
  <title>Post Internship</title>
  <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>

<div class="layout">

  <aside class="sidebar">
    <h3>Company</h3>
    <a href="post_internship.html" class="active">Post Internship</a>
    <a href="applied_projects.html">Hire Student</a>
    <a href="all_applications.html">All Applications</a>
    <a href="profile.html">Profile</a>
    <button onclick="logout()" class="btn secondary">Logout</button>
  </aside>

  <main class="content">
    <h2>Post Internship</h2>

    <form id="internshipForm">
      <input type="text" id="role_title" placeholder="Internship Role Title" required>

      <textarea
        id="role_description"
        placeholder="Role Description (what the intern will work on)"
        required
      ></textarea>

      <input
        type="text"
        id="required_skills"
        placeholder="Required Skills (comma separated)"
        required
      >

      <select id="paid" required>
        <option value="">Paid?</option>
        <option value="true">Paid</option>
        <option value="false">Unpaid</option>
      </select>

      <input
        type="number"
        id="stipend_amount"
        placeholder="Stipend Amount (if paid)"
      >

      <select id="mode" required>
        <option value="">Mode</option>
        <option value="Online">Online</option>
        <option value="Offline">Offline</option>
      </select>

      <button type="submit" class="btn">Post Internship</button>
      <p id="error" class="error"></p>
    </form>
  </main>

</div>

<script src="../../assets/js/company.js"></script>
</body>
</html>
